# Spring Boot Application Configuration

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Information
spring.application.name=hello-ws-microservice

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.hello_ws=DEBUG
logging.level.org.springframework.ws=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator Endpoints (for microservice monitoring)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# SOAP Web Service Configuration
spring.ws.servlet.load-on-startup=1
