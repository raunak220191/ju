version: '3.8'

services:
  hello-microservice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hello-microservice
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xmx512m -Xms256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - microservice-network

networks:
  microservice-network:
    driver: bridge
